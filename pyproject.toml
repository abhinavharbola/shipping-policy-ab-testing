[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shipping-experiment"
version = "0.1.0"
description = "Preregistered, simulated A/B test on a free-shipping policy change, calibrated from real Olist e-commerce data."
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "statsmodels",
]

[project.optional-dependencies]
dashboard = ["streamlit", "plotly"]
dev = ["pytest", "pyflakes"]

[project.scripts]
shipping-calibrate = "pipeline.calibration:main"
shipping-power = "pipeline.power_analysis:main"
shipping-simulate = "pipeline.simulate:main"
shipping-randomize = "pipeline.randomize:main"
shipping-analyze = "pipeline.analyze:main"
shipping-report = "pipeline.reporting:main"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["data*"]
